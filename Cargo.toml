[workspace]
members = ["examples/simple_app", "examples/advanced_app"]

[package]
name = "actix-guard-rs"
version = "2.0.0"
edition = "2024"
rust-version = "1.92"
description = "Application-layer security middleware for actix-web, powered by the guard-core-rs engine. Part of the guard ecosystem."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Guard-Core/actix-guard-rs"
readme = "README.md"
keywords = ["security", "middleware", "api", "actix", "actix-web"]
categories = ["web-programming"]

[lib]
name = "actix_guard_rs"

[dependencies]
actix-web = { version = "4", default-features = false }
bytes = "1.10"
# Stream trait for polling the request payload directly (Payload is Unpin).
futures-core = { version = "0.3", default-features = false }
# guard-core-engine is published to crates.io (the 4.3 line); the path points at the
# engine crate inside a sibling guard-core-rs checkout so local builds and CI
# (see .github/workflows/ci.yml) exercise the engine from source. The version
# pin stays in lockstep with the published engine release.
guard-core-engine = { path = "../guard-core-rs/crates/guard-core-engine", version = "4.4.0" }
# The engine facade (the event bus, observability knobs, the on_block hook,
# custom error responses, and the rate-limit stage the transform delegates
# to). Path points at the sibling guard-core-rs checkout so local builds and
# CI exercise it from source; the version pin stays in lockstep with the
# published facade release.
guard-core-rs = { path = "../guard-core-rs/crates/guard-core-rs", version = "4.4.0" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The telemetry agent built from the `agent_*` config fields (the reference
# `guard_agent(config.to_agent_config())`): feature `agent`. guard-agent-rs
# depends on the guard-core-rs facade (its `guard-core` feature), never the
# reverse, so the facade cannot own this and each adapter does. The runtime
# handle the agent's async tasks run on is the one actix-rt already runs.
guard-agent-rs = { version = "3.2.4", optional = true, default-features = false, features = ["guard-core"] }
tokio = { version = "1", optional = true, default-features = false, features = ["rt"] }

[features]
default = []
# Forward the facade's Redis backend: `enable_redis` with a `redis_url` then
# builds the distributed rate-limit and ban stores.
redis = ["guard-core-rs/redis"]
# Build the telemetry agent from `SecurityConfig` (see `GuardTransform::from_security_config`).
agent = ["dep:guard-agent-rs", "dep:tokio"]

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }

# One guard-core-rs for the whole graph: the registry copy guard-agent-rs
# names resolves to the sibling checkout this crate already builds against,
# so the agent bridge and the transform share the `TelemetryHandler` type.
[patch.crates-io]
guard-core-rs = { path = "../guard-core-rs/crates/guard-core-rs" }

[lints.rust]
unsafe_code = "forbid"
# cargo-llvm-cov sets cfg(coverage) during coverage builds; declare it so the
# cfg(not(coverage)) pairs in the sources stay lint-clean.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
all                     = { level = "deny", priority = -1 }
pedantic                = { level = "warn", priority = -1 }
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
module_name_repetitions = "allow"
